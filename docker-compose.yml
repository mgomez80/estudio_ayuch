# Stack completo Estudio Ayuch (VPS / deploy único)
# Uso:  cp .env.example .env  &&  docker compose up -d --build
# Nota: en la notebook local se sigue usando backend/docker-compose.yml
#       (mismos nombres de contenedores: correr ambos a la vez da conflicto).

services:
  db:
    image: mysql:8.0
    container_name: db-estudio_ayuch
    restart: unless-stopped
    environment:
      # Viene de .env (MYSQL_ROOT_PASSWORD). Sin default inseguro: el compose
      # falla explícitamente si falta, en vez de usar una clave conocida.
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Defini MYSQL_ROOT_PASSWORD en el archivo .env}"
      MYSQL_DATABASE: db_estudio_ayuch
    ports:
      # Bind solo a localhost: la DB no debe ser alcanzable desde fuera del VPS.
      - "127.0.0.1:3312:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/docker/init:/docker-entrypoint-initdb.d
    networks:
      - estudio_ayuch_net

  api:
    build: ./backend
    container_name: backend-api-estudio_ayuch
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      - db
    networks:
      - estudio_ayuch_net

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin a través del proxy /api de nginx (ver frontend/nginx.conf).
        # No usar http://localhost:8005: ese host sería el navegador del usuario,
        # no el servidor, y el login falla aunque usuario/clave sean correctos.
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: frontend-estudio_ayuch
    restart: unless-stopped
    ports:
      - "3008:80"
    depends_on:
      - api
    networks:
      - estudio_ayuch_net

networks:
  estudio_ayuch_net:
    driver: bridge

volumes:
  db_data:
