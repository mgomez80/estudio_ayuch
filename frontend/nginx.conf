server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html (React Router)
    # index.html sin cache: los bundles van con hash en el nombre, el HTML siempre fresco.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend-api dentro de la misma red Docker.
    # Si usás esta opción, buildeá el frontend con --build-arg VITE_API_URL=/api
    # y así evitás configurar CORS en FastAPI (todo queda same-origin).
    # location /api/ {
    #     proxy_pass http://backend-api-estudio_lg:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
